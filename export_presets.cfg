[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*"
export_path="build/web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=true
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<script>
// Cloudflare Pages caps files at 25 MiB, so CI deploys index.wasm/index.pck gzipped.
// Fetch the .gz and inflate it in the browser; fall back to the plain file (local runs).
(function () {
  const types = { wasm: 'application/wasm', pck: 'application/octet-stream' };
  const plainFetch = window.fetch.bind(window);
  window.fetch = async function (input, init) {
    const url = typeof input === 'string' ? input : input.url;
    const ext = url.split('?')[0].split('.').pop();
    if (!(ext in types) || !('DecompressionStream' in window)) {
      return plainFetch(input, init);
    }
    const gz = await plainFetch(url + '.gz', init);
    const type = gz.headers.get('Content-Type') || '';
    if (!gz.ok || type.includes('html')) {
      return plainFetch(input, init);
    }
    const body = gz.body.pipeThrough(new DecompressionStream('gzip'));
    return new Response(body, { status: 200, headers: { 'Content-Type': types[ext] } });
  };
})();
</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=true
progressive_web_app/ensure_cross_origin_isolation_headers=true
